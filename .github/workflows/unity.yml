# Unity no CI (P15): o que o client/tools/verify.sh full faz no PC, rodando no GitHub com GameCI (docker unityci/editor).
#   editmode  testes EditMode do Unity (NUnit 3.5: pega a tupla int x long que o dotnet test deixa passar)
#   windows   Setup.BuildWindows (Mono, imagem windows-mono) e o .exe com -autoplay 10 num runner Windows
#   android   Setup.BuildAndroidDev (IL2CPP ARM64; compila o caminho #if UNITY_ANDROID que o viewcheck android cobre no PC)
# Sem os secrets UNITY_EMAIL e UNITY_PASSWORD os jobs do Unity ficam como "skipped" (não reprovam o PR). Como configurar: docs/CI_UNITY.md
name: unity
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: unity-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true   # PR: só o último push; main: um grupo por commit, merge seguido não cancela
env:
  # o unity-builder e o unity-test-runner buscam a última versão do game-ci/cli na API do GitHub; sem token o limite de 60/h por IP do runner dá 403
  GITHUB_TOKEN: ${{ github.token }}
  UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
  UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
  UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
jobs:
  licenca:
    name: licença do Unity configurada?
    runs-on: ubuntu-latest
    outputs:
      ok: ${{ steps.c.outputs.ok }}
    steps:
      - id: c
        run: |
          # licença Personal: o .ulf do PC é preso à máquina ("Machine bindings don't match"); o GameCI ativa pela conta (e-mail + senha)
          if [ -n "$UNITY_EMAIL" ] && [ -n "$UNITY_PASSWORD" ]; then echo ok=true >> "$GITHUB_OUTPUT"
          else echo ok=false >> "$GITHUB_OUTPUT"; echo "::warning::sem os secrets UNITY_EMAIL e UNITY_PASSWORD: EditMode, build e autoplay não rodaram (docs/CI_UNITY.md)"; fi

  editmode:
    name: EditMode (Unity)
    needs: licenca
    if: needs.licenca.outputs.ok == 'true'
    runs-on: ubuntu-latest
    permissions:   # o unity-test-runner publica o resumo dos testes como check run; sem checks: write ele reprova o job
      contents: read
      checks: write
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: client/Library
          key: library-editmode-${{ hashFiles('client/Packages/packages-lock.json', 'client/ProjectSettings/ProjectVersion.txt') }}-${{ hashFiles('client/Assets/**/*.meta') }}
          restore-keys: library-editmode-${{ hashFiles('client/Packages/packages-lock.json', 'client/ProjectSettings/ProjectVersion.txt') }}-
      - uses: game-ci/unity-test-runner@v4.4.0
        id: testes
        with:
          projectPath: client
          testMode: editmode
          artifactsPath: editmode
      - name: veredito do XML (como o verify.sh)
        if: always()
        run: |
          x=$(ls ${{ steps.testes.outputs.artifactsPath || 'editmode' }}/*.xml 2>/dev/null | head -1)
          [ -n "$x" ] || { echo "::error::EditMode sem XML de resultado"; exit 1; }
          run=$(grep -m1 -o '<test-run [^>]*>' "$x")
          echo "EditMode: $(echo "$run" | grep -oE '(total|passed|failed)="[0-9]+"' | paste -sd' ')"
          [[ "$run" == *'result="Passed"'* ]] || { grep -oE '<test-case [^>]*result="Failed"[^>]*' "$x" | grep -oE 'fullname="[^"]*"' | head -30; exit 1; }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: editmode
          path: ${{ steps.testes.outputs.artifactsPath || 'editmode' }}

  windows:
    name: build Windows (Setup.BuildWindows)
    needs: licenca
    if: needs.licenca.outputs.ok == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: client/Library
          key: library-win-${{ hashFiles('client/Packages/packages-lock.json', 'client/ProjectSettings/ProjectVersion.txt') }}-${{ hashFiles('client/Assets/**/*.meta') }}
          restore-keys: library-win-${{ hashFiles('client/Packages/packages-lock.json', 'client/ProjectSettings/ProjectVersion.txt') }}-
      - uses: game-ci/unity-builder@v6
        with:
          projectPath: client
          targetPlatform: StandaloneWindows64
          buildMethod: FS.EditorTools.Setup.BuildWindows
          versioning: None
          allowDirtyBuild: true
      - name: BuildSummary
        run: ls -la client/Builds/win && test -f client/Builds/win/ForgeStreet.exe
      - uses: actions/upload-artifact@v7
        with:
          name: build-win
          path: client/Builds/win
          retention-days: 3

  autoplay:
    name: autoplay 10 min (bot no .exe)
    needs: windows
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: build-win
          path: win
      - name: ForgeStreet.exe -batchmode -nographics -autoplay 10
        shell: bash
        run: |
          rc=0; ./win/ForgeStreet.exe -batchmode -nographics -autoplay 10 -logFile autoplay.log || rc=$?
          grep -E 'AUTOPLAY|Exception' autoplay.log | tail -40
          a=$(grep -m1 -o 'AUTOPLAY OK.*' autoplay.log) || { echo "::error::sem 'AUTOPLAY OK' (saída $rc)"; exit 1; }
          [ $rc = 0 ] || { echo "::error::autoplay saiu $rc"; exit 1; }
          echo "autoplay: $a"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: autoplay-log
          path: autoplay.log

  android:
    name: build Android (Setup.BuildAndroidDev)
    needs: licenca
    if: needs.licenca.outputs.ok == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      # a imagem android + IL2CPP + Gradle não cabem nos ~14 GB livres do runner
      - uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          large-packages: false
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: client/Library
          key: library-android-${{ hashFiles('client/Packages/packages-lock.json', 'client/ProjectSettings/ProjectVersion.txt') }}-${{ hashFiles('client/Assets/**/*.meta') }}
          restore-keys: library-android-${{ hashFiles('client/Packages/packages-lock.json', 'client/ProjectSettings/ProjectVersion.txt') }}-
      - uses: game-ci/unity-builder@v6
        with:
          projectPath: client
          targetPlatform: Android
          buildMethod: FS.EditorTools.Setup.BuildAndroidDev
          versioning: None
          allowDirtyBuild: true
      - name: tamanho do APK (o BuildSummary soma o conteúdo sem compressão; o que vale é o arquivo)
        run: |
          apk=client/Builds/android/ForgeStreet-dev.apk
          test -f "$apk"
          mb=$(( $(stat -c %s "$apk") / 1048576 ))
          { echo "### APK de dev: $mb MB (limite da Play no módulo base: 200 MB)"; echo '```'
            unzip -lv "$apk" > lista.txt
            # por grupo: assets/bin/Data = texturas e cenas; lib = IL2CPP e Unity; dex = Java dos plugins
            awk 'NR > 3 && $1 ~ /^[0-9]+$/ { g = $8; sub(/\/[^\/]*$/, "", g); if ($8 ~ /\.dex$/) g = "*.dex"; c[g] += $3; n[g]++ }
                 END { for (g in c) printf "%8.1f MB  %5d arquivos  %s\n", c[g] / 1048576, n[g], g }' lista.txt | sort -rn | head -8
            echo; awk 'NR > 3 && $1 ~ /^[0-9]+$/ { printf "%8.1f MB  %8.1f MB  %s\n", $3 / 1048576, $1 / 1048576, $8 }' lista.txt | sort -rn | head -10
            echo '```'; echo "MB comprimido no APK (no 2º bloco: comprimido, sem compressão, arquivo)"; } | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$mb" -lt 200 ] || { echo "::error::APK com $mb MB: passa do limite de 200 MB da Play"; exit 1; }
          [ "$mb" -lt 160 ] || echo "::warning::APK com $mb MB, perto do limite de 200 MB da Play"
      - uses: actions/upload-artifact@v7
        with:
          name: apk-dev
          path: client/Builds/android/ForgeStreet-dev.apk
          retention-days: 3
